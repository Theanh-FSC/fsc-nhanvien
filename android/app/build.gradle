plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'vn.fsc.chamcong'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.fsc.chamcong'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "2.0.${runNumber}"
    }

    signingConfigs {
        release {
            storeFile file('fsc-chamcong.jks')
            storePassword 'FscChamCong2026'
            keyAlias 'fsc'
            keyPassword 'FscChamCong2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
