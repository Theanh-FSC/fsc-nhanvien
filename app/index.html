<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0F6E56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FSC Chấm Công">
<title>FSC Chấm Công</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #F3F5F4; --primary: #0F6E56; --primary-soft: #E7F2EE; --out: #C2571A; --text: #1D2420; --muted: #66706B;
    --ok: #1E8A4C; --bad: #C0392B; --warn: #B7791F; --disabled: #B9C1BD; --line: #E1E6E3; --card: #fff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; }
  .top { background: var(--primary); height: env(safe-area-inset-top); position: sticky; top: 0; z-index: 9; }
  .page { max-width: 520px; margin: 0 auto; padding: 18px 18px calc(96px + env(safe-area-inset-bottom)); }
  .page.noNav { padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .center { text-align: center; }
  h1 { color: var(--primary); font-size: 28px; margin: 34px 0 2px; }
  h2 { font-size: 17px; margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .lbl { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; margin: 0 0 4px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 6px; }
  input, textarea { width: 100%; font: inherit; font-size: 18px; padding: 12px; border: 1px solid #CBD3CF; border-radius: 10px; background: #F7F9F8; color: var(--text); -webkit-appearance: none; }
  textarea { font-size: 16px; resize: none; }
  input:focus, textarea:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 0 12px; height: 60px; font: inherit; font-size: 18px; font-weight: 700; color: #fff; background: var(--primary); margin-top: 12px; }
  .btn.out { background: var(--out); }
  .btn:disabled { background: var(--disabled) !important; }
  .link { background: none; border: 0; color: var(--primary); font: inherit; padding: 6px 0; }
  .err { color: var(--bad); font-size: 14px; min-height: 18px; margin-top: 8px; white-space: pre-line; }
  .okc { color: var(--ok); } .badc { color: var(--bad); } .warnc { color: var(--warn); }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .head .who { flex: 1; min-width: 0; }
  .head b { display: block; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clock { font-size: 46px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .big { font-size: 18px; font-weight: 700; }
  .msg { text-align: center; font-size: 14px; margin-top: 10px; min-height: 20px; white-space: pre-line; }
  .hist { white-space: pre-line; font-size: 14px; line-height: 1.7; font-variant-numeric: tabular-nums; }
  .row2 { display: flex; justify-content: space-between; gap: 10px; }
  .stats { display: flex; gap: 10px; }
  .stats > div { flex: 1; }
  .stats .v { font-size: 22px; font-weight: 700; color: var(--primary); }
  .day { padding: 9px 0; border-bottom: 1px solid #EEF1EF; }
  .day:last-child { border-bottom: 0; }
  .day .row2 b { font-size: 15px; }
  .day .s { font-size: 13px; color: var(--muted); white-space: pre-line; }
  .day.pending { opacity: .75; }
  .kv { display: flex; justify-content: space-between; padding: 6px 0; }
  .kv span { color: var(--muted); }
  .total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; font-size: 17px; font-weight: 700; }
  .total b { color: var(--primary); font-size: 19px; }
  .ky { display: flex; align-items: center; padding: 6px; }
  .ky button { background: none; border: 0; font-size: 22px; color: var(--primary); padding: 8px 16px; }
  .ky button:disabled { color: var(--disabled); }
  .ky div { flex: 1; text-align: center; }
  .types { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .types button { font: inherit; padding: 12px 6px; border-radius: 10px; border: 1px solid #CBD3CF; background: #F7F9F8; color: var(--text); }
  .types button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .leave { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #EEF1EF; }
  .leave:last-child { border-bottom: 0; }
  .leave div { flex: 1; }
  .leave button { background: none; border: 0; color: var(--bad); font: inherit; padding: 8px 4px; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; box-shadow: 0 -2px 10px rgba(0,0,0,.08); display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 8; }
  nav button { flex: 1; border: 0; background: #fff; font: inherit; padding: 7px 0 6px; color: var(--muted); }
  nav button .i { display: block; font-size: 19px; line-height: 1.2; }
  nav button .t { font-size: 11px; }
  nav button.on { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 20; }
  .modal .box { background: #fff; border-radius: 16px; padding: 18px; max-width: 400px; width: 100%; }
  .modal .box p { white-space: pre-line; margin: 6px 0 4px; }
  .modal .acts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
  .modal .acts button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 16px; background: #EEF1EF; color: var(--text); }
  .modal .acts button.pri { background: var(--primary); color: #fff; }
  .steps { padding-left: 20px; line-height: 1.8; }
  .share { display: inline-block; border: 1px solid var(--muted); border-radius: 5px; padding: 0 5px; font-size: 13px; }
</style>
</head>
<body>
<div class="top"></div>
<div id="app"></div>
<nav id="nav" hidden></nav>
<div id="modal"></div>
<script>
'use strict';
const API_URL = 'https://script.google.com/macros/s/AKfycbwPZitbwnMuiqy4u0_2gQQJR57l03DPp50CYgab-d_RjQYavIznZyz_8P25tC86cGd-/exec';
const VERSION = 'web 1.0';
const VI_TRI_CU_MS = 60000;
const TABS = [['scan', '⏱', 'Chấm công'], ['cong', '📅', 'Ngày công'], ['sl', '📦', 'Sản lượng'], ['luong', '💵', 'Lương'], ['nghi', '📝', 'Xin nghỉ']];
const LOAI_NGHI = [['PHEP', 'Nghỉ phép'], ['NUA_NGAY', 'Nghỉ nửa ngày'], ['OM', 'Nghỉ ốm'], ['KHONG_LUONG', 'Nghỉ không lương']];

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { v == null || v === '' ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Device ID "APP-…": máy chủ cho chuyển tài khoản đang gắn web cũ sang app 1 lần.
function deviceId() {
  let id = store.get('fsc_app_device');
  if (!id) {
    const u = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(16) + Math.random().toString(16).slice(2));
    id = ('APP-' + u).replace(/[^A-Za-z0-9-]/g, '').slice(0, 64);
    store.set('fsc_app_device', id);
  }
  return id;
}

const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);

async function api(action, body) {
  const payload = JSON.stringify(Object.assign({ action, deviceId: deviceId(), app: VERSION }, store.get('fsc_app_token') ? { token: store.get('fsc_app_token') } : {}, body || {}));
  const waits = [2000, 4000, 6000];
  for (let i = 0; ; i++) {
    let res;
    try {
      const r = await fetch(API_URL, { method: 'POST', body: payload });
      res = await r.json();
    } catch (e) {
      const err = new Error('Không kết nối được máy chủ. Kiểm tra mạng (4G/Wi-Fi) rồi thử lại.'); err.code = 'net'; throw err;
    }
    if (res.ok) return res;
    if (res.code === 'busy' && i < waits.length) { await new Promise(r => setTimeout(r, waits[i])); continue; }
    const err = new Error(res.error || 'Máy chủ gặp lỗi, vui lòng thử lại.'); err.code = res.code || ''; throw err;
  }
}

/* ---------------- Định dạng ---------------- */
const pad = n => String(n).padStart(2, '0');
function vnNow() { return new Date(Date.now() + (new Date().getTimezoneOffset() + 420) * 60000); }
function isoOf(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function todayIso() { return isoOf(vnNow()); }
function dm(iso) { const p = String(iso || '').split('-'); return p.length === 3 ? `${p[2]}/${p[1]}` : ''; }
function dmy(iso) { const p = String(iso || '').split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : ''; }
function thuNgan(iso) { const p = String(iso || '').split('-'); if (p.length !== 3) return ''; return ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][new Date(+p[0], +p[1] - 1, +p[2]).getDay()]; }
function thuDai(d) { return ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'][d.getDay()]; }
function num(x, dec) {
  x = Number(x) || 0;
  if (Math.abs(x - Math.round(x)) < 1e-9) dec = 0;
  return x.toLocaleString('vi-VN', { minimumFractionDigits: 0, maximumFractionDigits: dec });
}
const money = x => num(Math.round(Number(x) || 0), 0) + ' đ';
function kyTen(k) { const p = String(k || '').split('-'); return p.length === 2 ? `Kỳ ${p[1]}/${p[0]}` : k; }
function kyKhoang(k) { const p = String(k || '').split('-'); if (p.length !== 2) return ''; const m = +p[1]; return `26/${pad(m === 1 ? 12 : m - 1)} – 25/${pad(m)}`; }
function kyTuDen(k) {
  const p = String(k || '').split('-'); if (p.length !== 2) return null;
  const y = +p[0], m = +p[1], py = m === 1 ? y - 1 : y, pm = m === 1 ? 12 : m - 1;
  return [`${py}-${pad(pm)}-26`, `${y}-${pad(m)}-25`];
}
function khoangCach(lat1, lng1, lat2, lng2) {
  const R = 6371000, t = Math.PI / 180, dLat = (lat2 - lat1) * t, dLng = (lng2 - lng1) * t;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * t) * Math.cos(lat2 * t) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

/* ---------------- Hộp thoại ---------------- */
function dialog(title, message, okText, cancelText) {
  return new Promise(resolve => {
    $('modal').innerHTML = `<div class="modal"><div class="box">${title ? `<h2>${esc(title)}</h2>` : ''}<p>${esc(message)}</p>
      <div class="acts">${cancelText ? `<button id="mNo">${esc(cancelText)}</button>` : ''}<button class="pri" id="mOk">${esc(okText || 'OK')}</button></div></div></div>`;
    $('mOk').onclick = () => { $('modal').innerHTML = ''; resolve(true); };
    if (cancelText) $('mNo').onclick = () => { $('modal').innerHTML = ''; resolve(false); };
  });
}

/* ---------------- Màn hướng dẫn cài trên iPhone ---------------- */
function showInstall() {
  $('nav').hidden = true;
  $('app').innerHTML = `<div class="page noNav">
    <h1>FSC Chấm Công</h1>
    <p class="muted">Cài lên màn hình chính để dùng như app</p>
    <div class="card">
      <ol class="steps">
        <li>Bấm nút <b>Chia sẻ</b> <span class="share">⬆︎</span> ở thanh dưới của Safari.</li>
        <li>Kéo xuống, chọn <b>Thêm vào MH chính</b> (Add to Home Screen).</li>
        <li>Bấm <b>Thêm</b>. Biểu tượng <b>FSC Chấm Công</b> xuất hiện trên màn hình.</li>
        <li>Mở app từ biểu tượng đó rồi đăng nhập. Khi được hỏi vị trí, chọn <b>Cho phép</b>.</li>
      </ol>
      <p class="small muted">Phải mở bằng Safari (không dùng Zalo, Facebook, Chrome trên iPhone). Đăng nhập trong app đã cài, không đăng nhập ở Safari, để khỏi bị khóa thiết bị.</p>
    </div>
    <button class="link" id="bSafari">Vẫn dùng trong Safari</button>
  </div>`;
  $('bSafari').onclick = () => { store.set('fsc_app_safari', '1'); showLogin(); };
}

/* ---------------- Đăng nhập ---------------- */
let lookupTimer = null;
function showLogin(msg) {
  stopGps();
  $('nav').hidden = true;
  $('app').innerHTML = `<div class="page noNav">
    <h1>FSC Chấm Công</h1>
    <p class="muted">Đăng nhập bằng Mã NV và mật khẩu</p>
    <div class="card" style="margin-top:22px">
      <label for="iCode">Mã nhân viên</label>
      <input id="iCode" autocapitalize="characters" autocomplete="username" maxlength="20" placeholder="Ví dụ F018" value="${esc(store.get('fsc_app_code'))}">
      <div id="tTen" class="small okc" style="min-height:18px;margin-top:4px"></div>
      <label for="iPin">Mật khẩu</label>
      <input id="iPin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" placeholder="Mật khẩu">
      <div class="err" id="eLogin">${esc(msg || '')}</div>
      <button class="btn" id="bLogin">ĐĂNG NHẬP</button>
      <p class="small muted">Lần đầu đăng nhập: dùng mật khẩu mặc định do quản lý cung cấp, sau đó đặt mật khẩu riêng 4–8 số.</p>
    </div>
    <p class="small muted center">Phiên bản ${VERSION}</p>
  </div>`;
  const code = $('iCode');
  const traTen = async () => {
    const ma = code.value.trim().toUpperCase();
    if (ma.length < 2) { $('tTen').textContent = ''; return; }
    $('tTen').className = 'small muted'; $('tTen').textContent = 'Đang tìm…';
    try {
      const r = await api('lookup', { code: ma });
      if (code.value.trim().toUpperCase() !== ma) return;
      $('tTen').className = 'small okc'; $('tTen').textContent = '✓ ' + r.name + (r.team ? ' · ' + r.team : '');
    } catch (e) {
      if (code.value.trim().toUpperCase() !== ma) return;
      $('tTen').className = 'small badc'; $('tTen').textContent = e.message;
    }
  };
  code.addEventListener('input', () => { code.value = code.value.toUpperCase(); clearTimeout(lookupTimer); lookupTimer = setTimeout(traTen, 600); });
  if (code.value.length >= 2) traTen();
  const go = async () => {
    const c = code.value.trim().toUpperCase(), p = $('iPin').value.trim();
    if (!c || !p) { $('eLogin').textContent = 'Nhập Mã NV và mật khẩu.'; return; }
    const b = $('bLogin'); b.disabled = true; b.textContent = 'Đang đăng nhập…'; $('eLogin').textContent = '';
    try {
      store.set('fsc_app_token', '');
      const r = await api('login', { code: c, pin: p });
      store.set('fsc_app_code', c);
      if (r.mustSetPin) showSetPin(r.setupToken, r.profile);
      else { savePhien(r); showMain(); }
    } catch (e) {
      b.disabled = false; b.textContent = 'ĐĂNG NHẬP'; $('eLogin').textContent = e.message;
    }
  };
  $('bLogin').onclick = go;
  $('iPin').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

function showSetPin(setupToken, profile) {
  $('app').innerHTML = `<div class="page noNav">
    <h1>Đặt mật khẩu mới</h1>
    <p>${profile ? esc(profile.name + ' – ' + profile.code) : ''}</p>
    <div class="card">
      <label for="p1">Mật khẩu mới (4–8 chữ số)</label>
      <input id="p1" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password">
      <label for="p2">Nhập lại mật khẩu</label>
      <input id="p2" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password">
      <div class="err" id="ePin"></div>
      <button class="btn" id="bPin">LƯU MẬT KHẨU</button>
    </div></div>`;
  $('bPin').onclick = async () => {
    const a = $('p1').value.trim();
    if (!/^\d{4,8}$/.test(a)) { $('ePin').textContent = 'Mật khẩu gồm 4 đến 8 chữ số.'; return; }
    if (a !== $('p2').value.trim()) { $('ePin').textContent = 'Hai lần nhập không giống nhau.'; return; }
    $('bPin').disabled = true;
    try {
      const r = await api('setPin', { setupToken, newPin: a });
      savePhien(r); showMain();
    } catch (e) {
      $('bPin').disabled = false; $('ePin').textContent = e.message;
      if (e.code === 'auth') showLogin('Hết thời gian đặt mật khẩu, đăng nhập lại.');
    }
  };
}

function savePhien(r) {
  store.set('fsc_app_token', r.token);
  if (r.profile) { store.set('fsc_app_name', r.profile.name); store.set('fsc_app_team', r.profile.team); store.set('fsc_app_code', r.profile.code); }
}
function dangXuat(msg) { store.set('fsc_app_token', ''); me = null; showLogin(msg); }

/* ---------------- Màn chính ---------------- */
let tab = 'scan', me = null, meErr = '', dangTaiMe = false;
let diem = [], banKinh = 200, saiSoToiDa = 100, statusOk = false, statusErr = '', dangTrongCa = false;
let caHtml = '…', histText = '…', scanMsg = { t: '', c: '' }, busy = false;
let best = null, gpsErr = null, watchId = null, clockTimer = null;
let loaiNghi = '', ngayNghi = '', ghiChuNghi = '';

function showMain() {
  $('nav').hidden = false;
  $('nav').innerHTML = TABS.map(t => `<button data-tab="${t[0]}"><span class="i">${t[1]}</span><span class="t">${t[2]}</span></button>`).join('');
  $('nav').querySelectorAll('button').forEach(b => b.onclick = () => chonTab(b.dataset.tab));
  chonTab(tab);
  startGps();
  clearInterval(clockTimer);
  clockTimer = setInterval(tick, 1000);
  taiTrangThai(false);
  taiMe(null);
}

function headHtml() {
  const team = store.get('fsc_app_team');
  return `<div class="head"><div class="who"><b>${esc(store.get('fsc_app_name'))}</b><span class="muted">${esc(store.get('fsc_app_code'))}${team ? ' · ' + esc(team) : ''}</span></div>
    <button class="link" id="bOut">Đăng xuất</button></div>`;
}

function chonTab(t) {
  tab = t;
  $('nav').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  render();
  window.scrollTo(0, 0);
}

function render() {
  let body;
  if (tab === 'scan') body = scanHtml();
  else if (!me) body = meErr ? `<div class="card"><div class="badc">${esc(meErr)}</div><button class="btn" id="bRetry">THỬ LẠI</button></div>` : '<div class="card muted">Đang tải dữ liệu…</div>';
  else body = (tab !== 'nghi' ? kyHtml() : '') + (tab === 'cong' ? congHtml() : tab === 'sl' ? slHtml() : tab === 'luong' ? luongHtml() : nghiHtml());
  $('app').innerHTML = `<div class="page">${headHtml()}${body}</div>`;
  $('bOut').onclick = async () => { if (await dialog('', 'Đăng xuất khỏi điện thoại này?', 'Đăng xuất', 'Hủy')) dangXuat(); };
  if ($('bRetry')) $('bRetry').onclick = () => taiMe(null);
  if (tab === 'scan') bindScan();
  if (me && tab !== 'nghi') bindKy();
  if (me && tab === 'nghi') bindNghi();
}

/* ----- Tab chấm công ----- */
function scanHtml() {
  const now = vnNow();
  return `<div class="card center"><div class="clock" id="tClock">${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}</div>
      <div class="muted" id="tDate">${thuDai(now)}, ${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()}</div></div>
    <div class="card" id="cGps"><div class="lbl">VỊ TRÍ</div><div class="big" id="tGps"></div><div class="small muted" id="tGpsSub" style="white-space:pre-line"></div></div>
    <div class="card"><div class="lbl">CA LÀM VIỆC</div><div class="big" id="tShift">${caHtml}</div></div>
    <button class="btn" id="bIn">XÁC NHẬN GIỜ VÀO</button>
    <button class="btn out" id="bOutCa">XÁC NHẬN GIỜ RA</button>
    <div class="msg ${scanMsg.c}" id="tMsg">${esc(scanMsg.t)}</div>
    <div class="card" style="margin-top:12px"><div class="row2"><div class="lbl">CHẤM CÔNG 7 NGÀY GẦN ĐÂY</div><button class="link" id="bReload" style="padding:0">Tải lại</button></div>
      <div class="hist" id="tHist">${esc(histText)}</div></div>
    <p class="small muted">Phiên bản ${VERSION} · Chỉ chấm công được khi ở trong vùng của kho.</p>`;
}

function bindScan() {
  $('bIn').onclick = () => xacNhan('IN');
  $('bOutCa').onclick = () => xacNhan('OUT');
  $('bReload').onclick = () => taiTrangThai(true);
  $('cGps').onclick = () => { if (gpsErr || !statusOk) { startGps(true); taiTrangThai(true); } };
  capNhatGps();
}

function tick() {
  if (tab !== 'scan' || !$('tClock')) return;
  const now = vnNow();
  $('tClock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  $('tDate').textContent = `${thuDai(now)}, ${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()}`;
  capNhatGps();
}

async function taiTrangThai(baoLoi) {
  try {
    const r = await api('status');
    diem = r.diem || []; banKinh = Number(r.banKinh) || 200; saiSoToiDa = Number(r.saiSoToiDa) || 100;
    if (r.profile) { store.set('fsc_app_name', r.profile.name); store.set('fsc_app_team', r.profile.team); }
    statusOk = true; statusErr = '';
    hienCa(r.caMo); hienLichSu(r.ganDay);
  } catch (e) {
    if (e.code === 'auth' || e.code === 'device') return dangXuat(e.message);
    statusErr = /Không rõ thao tác/.test(e.message) ? 'Máy chủ chưa cập nhật bản mới cho app (FSC_WebApi.gs 06/11). Báo quản lý triển khai phiên bản mới.' : e.message;
    if (baoLoi || !statusOk) { caHtml = 'Chưa tải được dữ liệu'; scanMsg = { t: statusErr, c: 'badc' }; }
  }
  if (tab === 'scan') render();
}

function hienCa(ca) {
  const vao = ca && ca.vao, ra = ca && ca.ra;
  if (!vao) { dangTrongCa = false; caHtml = '<span class="muted">Chưa vào ca</span>'; }
  else if (!ra) { dangTrongCa = true; caHtml = `<span class="okc">Đang trong ca · vào ${esc(vao.gio)} ngày ${dm(vao.ngay)}</span>`; }
  else { dangTrongCa = false; caHtml = `Ca gần nhất: vào ${esc(vao.gio)} – ra ${esc(ra.gio)} (${dm(vao.ngay)})`; }
}

function hienLichSu(ds) {
  if (!ds || !ds.length) { histText = 'Chưa có lượt chấm công.'; return; }
  histText = ds.map(q => `${dm(q.ngay)}  ${q.gio}   ${q.loai === 'IN' ? 'VÀO' : q.loai === 'OUT' ? 'RA ' : '—  '}   ${q.hopLe ? '✓' : '✗ ' + (q.lyDo || '')}`).join('\n');
}

/* ----- GPS ----- */
function startGps(force) {
  if (!navigator.geolocation) { gpsErr = 'Điện thoại không hỗ trợ định vị.'; return; }
  if (watchId != null && !force) return;
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  gpsErr = null;
  watchId = navigator.geolocation.watchPosition(p => {
    const c = p.coords;
    if (!best || Date.now() - best.t > 15000 || c.accuracy <= best.acc + 5) best = { lat: c.latitude, lng: c.longitude, acc: c.accuracy, t: Date.now() };
    gpsErr = null;
    if (tab === 'scan') capNhatGps();
  }, e => {
    gpsErr = e.code === 1 ? 'denied' : e.code === 3 ? 'timeout' : 'unavailable';
    if (e.code === 1) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    if (tab === 'scan') capNhatGps();
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
}
function stopGps() { if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; } clearInterval(clockTimer); }

let trongVung = false, tenDiem = '', kcDiem = -1;
function capNhatGps() {
  if (!$('tGps')) return;
  let t, sub, cls, vung = false;
  const l = best && Date.now() - best.t <= VI_TRI_CU_MS ? best : null;
  if (gpsErr === 'denied') {
    t = 'Chưa cho phép dùng vị trí'; cls = 'badc';
    sub = isIOS ? 'Vào Cài đặt → Quyền riêng tư & Bảo mật → Dịch vụ định vị → bật, và mục Trang web Safari → Khi dùng ứng dụng + Vị trí chính xác. Sau đó chạm vào đây.'
                : 'Cho phép trang dùng vị trí (biểu tượng ổ khóa cạnh địa chỉ trang) rồi chạm vào đây.';
  } else if (!l) {
    t = 'Đang lấy vị trí GPS…'; cls = 'warnc'; sub = gpsErr ? 'Chưa bắt được GPS. Bật Dịch vụ định vị, ra chỗ thoáng, chạm vào đây để thử lại.' : 'Đứng chỗ thoáng, chờ vài giây.';
  } else if (!statusOk && statusErr) {
    t = 'Chưa tải được điểm chấm công'; cls = 'badc'; sub = statusErr + '\nChạm vào đây để thử lại.';
  } else if (!statusOk) {
    t = 'Đang tải điểm chấm công…'; cls = 'warnc'; sub = 'Chờ vài giây.';
  } else if (!diem.length) {
    t = 'Chưa có tọa độ kho'; cls = 'badc'; sub = 'Báo quản lý điền Vĩ độ / Kinh độ của kho trong tab DiemQuet.';
  } else {
    let min = Infinity, ten = '', bk = banKinh;
    diem.forEach(d => { const k = khoangCach(l.lat, l.lng, Number(d.lat), Number(d.lng)); if (k < min) { min = k; ten = d.kho || d.ma; bk = Number(d.banKinh) || banKinh; } });
    const kc = Math.round(min), acc = Math.round(l.acc);
    tenDiem = ten; kcDiem = kc;
    sub = `Cách ${ten} ${kc} m · sai số ±${acc} m · phạm vi ${bk} m`;
    if (acc > saiSoToiDa) { t = 'Tín hiệu GPS yếu'; cls = 'warnc'; sub += '\nRa chỗ thoáng, chờ vài giây.'; }
    else if (kc > bk) { t = 'Ngoài vùng chấm công'; cls = 'badc'; }
    else { t = 'Trong vùng chấm công ✓'; cls = 'okc'; vung = true; }
  }
  $('tGps').textContent = t; $('tGps').className = 'big ' + cls; $('tGpsSub').textContent = sub;
  trongVung = vung;
  const ok = vung && !busy;
  $('bIn').disabled = !ok; $('bOutCa').disabled = !ok;
  $('bIn').textContent = (dangTrongCa ? '' : '▶  ') + 'XÁC NHẬN GIỜ VÀO';
  $('bOutCa').textContent = (dangTrongCa ? '▶  ' : '') + 'XÁC NHẬN GIỜ RA';
}

async function xacNhan(mode) {
  if (busy) return;
  const l = best && Date.now() - best.t <= VI_TRI_CU_MS ? best : null;
  if (!l || !trongVung) return capNhatGps();
  const now = vnNow(), gio = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const loai = mode === 'IN' ? 'GIỜ VÀO' : 'GIỜ RA';
  let them = '';
  if (mode === 'IN' && dangTrongCa) them = '\n\nBạn đang trong ca (chưa xác nhận giờ ra). Chắc chắn muốn xác nhận GIỜ VÀO?';
  if (mode === 'OUT' && !dangTrongCa) them = '\n\nChưa thấy giờ vào của ca này. Chắc chắn muốn xác nhận GIỜ RA?';
  if (!await dialog('Xác nhận ' + loai, `${loai} lúc ${gio}\nTại: ${tenDiem} (cách ${kcDiem} m)${them}`, 'Xác nhận', 'Hủy')) return;
  busy = true; scanMsg = { t: 'Đang gửi…', c: 'muted' }; render();
  try {
    const r = await api('scan', { mode, lat: l.lat, lng: l.lng, acc: Math.round(l.acc) });
    busy = false;
    const vao = r.loai === 'IN', ten = vao ? 'GIỜ VÀO' : 'GIỜ RA';
    let msg = r.trungLap ? `Đã ghi nhận ${ten} lúc ${r.gio} trước đó (trong 5 phút). Không ghi thêm.`
                         : `Đã ghi nhận ${ten} lúc ${r.gio}\nTại ${r.kho || ''}` + (!vao && r.gioVao ? `\nCa vào lúc ${r.gioVao}` : '');
    if (r.canhBao) msg += '\n\n⚠ ' + r.canhBao;
    scanMsg = { t: '✓ ' + ten + ' ' + r.gio, c: 'okc' };
    if (navigator.vibrate) navigator.vibrate(120);
    render();
    dialog(r.canhBao ? 'Đã ghi nhận – có lưu ý' : 'Thành công', msg);
    taiTrangThai(false); taiMe(null);
  } catch (e) {
    busy = false;
    if (e.code === 'auth' || e.code === 'device') return dangXuat(e.message);
    scanMsg = { t: e.message, c: 'badc' }; render();
    dialog('Chưa chấm công được', e.message);
    taiTrangThai(false);
  }
}

/* ----- Ngày công, sản lượng, lương, xin nghỉ ----- */
async function taiMe(ky) {
  if (dangTaiMe) return;
  dangTaiMe = true; meErr = '';
  const k = ky == null ? (me ? me.ky : '') : ky;
  if (tab !== 'scan') render();
  try { me = await api('me', { ky: k }); }
  catch (e) {
    if (e.code === 'auth' || e.code === 'device') { dangTaiMe = false; return dangXuat(e.message); }
    meErr = e.message;
  }
  dangTaiMe = false;
  if (tab !== 'scan') render();
}

function kyHtml() {
  const ds = me.dsKy || [], i = ds.indexOf(me.ky);
  const truoc = i >= 0 && i + 1 < ds.length ? ds[i + 1] : '', sau = i > 0 ? ds[i - 1] : '';
  return `<div class="card ky"><button id="kPrev" data-k="${esc(truoc)}" ${truoc ? '' : 'disabled'}>◀</button>
    <div><b>${dangTaiMe ? 'Đang tải…' : esc(kyTen(me.ky))}</b><div class="small muted">${kyKhoang(me.ky)}</div></div>
    <button id="kNext" data-k="${esc(sau)}" ${sau ? '' : 'disabled'}>▶</button></div>`;
}
function bindKy() {
  ['kPrev', 'kNext'].forEach(id => { const b = $(id); if (b && b.dataset.k) b.onclick = () => taiMe(b.dataset.k); });
}

// Ghép ca từ lượt chấm công hợp lệ (giống máy chủ): ngày vào ca → [giờ vào, giờ ra]; ra trong 16 giờ sau vào.
function caTuQuet(quet) {
  const out = {}; let moMs = -1, moNgay = null;
  (quet || []).forEach(q => {
    if (!q.hopLe) return;
    if (q.loai === 'IN') {
      const g = out[q.ngay];
      if (!g) out[q.ngay] = [q.gio, ''];
      else if (!g[0] || q.gio < g[0]) g[0] = q.gio;
      moMs = q.ms; moNgay = q.ngay;
    } else if (q.loai === 'OUT') {
      if (moNgay && q.ms - moMs <= 16 * 3600000) out[moNgay][1] = q.gio;
      else if (!out[q.ngay]) out[q.ngay] = ['', q.gio]; else out[q.ngay][1] = q.gio;
    }
  });
  return out;
}

function congHtml() {
  const rows = me.ngayCong || [], ds = {};
  let tong = 0, tc = 0, cho = 0;
  rows.forEach(r => {
    tong += Number(r.cong) || 0; tc += Number(r.tangCa) || 0;
    let s = esc(r.trangThai);
    if (r.vao) s += ' · vào ' + esc(r.vao);
    if (r.ra) s += ' · ra ' + esc(r.ra);
    if (Number(r.tangCa) > 0) s += ' · tăng ca ' + num(r.tangCa, 1) + ' giờ';
    ds[r.ngay] = { r: num(r.cong, 1) + ' công', s, p: false };
  });
  const kh = kyTuDen(me.ky), ca = caTuQuet(me.quet);
  Object.keys(ca).forEach(ngay => {
    if (ds[ngay] || !kh || ngay < kh[0] || ngay > kh[1]) return;
    const g = ca[ngay];
    ds[ngay] = { r: 'chờ duyệt', s: 'Đã chấm công · chờ Dashboard duyệt' + (g[0] ? ' · vào ' + esc(g[0]) : ' · chưa có giờ vào') + (g[1] ? ' · ra ' + esc(g[1]) : ' · chưa có giờ ra'), p: true };
    cho++;
  });
  const days = Object.keys(ds).sort().reverse();
  return `<div class="card"><div class="stats"><div><div class="v">${num(tong, 1)}</div><div class="small muted">Ngày công đã duyệt</div></div>
      <div><div class="v">${cho}</div><div class="small muted">Ngày chờ duyệt</div></div></div>
      <p class="small muted" style="margin:8px 0 0">${tc > 0 ? 'Giờ tăng ca: ' + num(tc, 1) + ' giờ. ' : ''}Ngày công theo bảng chấm công đã duyệt trên Dashboard${me.capNhatLuc ? ', cập nhật lúc ' + esc(me.capNhatLuc) : ''}. Ngày "chờ duyệt" là ngày đã chấm công, sẽ tính công sau khi quản lý cập nhật Dashboard.</p></div>
    <div class="card">${days.length ? days.map(d => `<div class="day ${ds[d].p ? 'pending' : ''}"><div class="row2"><b>${thuNgan(d)} ${dm(d)}</b><b>${ds[d].r}</b></div><div class="s">${ds[d].s}</div></div>`).join('')
      : '<div class="muted">Chưa có ngày công trong kỳ này.</div>'}</div>`;
}

function slHtml() {
  const rows = me.sanLuong || [], by = {};
  let slKfm = 0, tien = 0;
  rows.forEach(r => { if (r.nguon === 'KFM') slKfm += Number(r.soLuong) || 0; tien += Number(r.thanhTien) || 0; (by[r.ngay] = by[r.ngay] || []).push(r); });
  const days = Object.keys(by).sort().reverse();
  return `<div class="card"><div class="stats"><div><div class="v">${num(slKfm, 0)}</div><div class="small muted">Sản lượng KFM</div></div>
      <div><div class="v">${money(tien)}</div><div class="small muted">Tiền sản lượng (KFM + CPG)</div></div></div></div>
    <div class="card">${days.length ? days.map(d => {
      const it = by[d], t = it.reduce((s, r) => s + (Number(r.thanhTien) || 0), 0);
      return `<div class="day"><div class="row2"><b>${thuNgan(d)} ${dm(d)}</b><b>${money(t)}</b></div>
        <div class="s">${it.map(r => `${esc(r.nguon)} · ${esc(r.congViec)} · ${num(r.soLuong, 2)} ${esc(r.dvt)} × ${num(r.donGia, 2)} đ`).join('\n')}</div></div>`;
    }).join('') : '<div class="muted">Chưa có sản lượng trong kỳ này.</div>'}</div>`;
}

function luongHtml() {
  const ls = me.luong || [];
  if (!ls.length) return '<div class="card muted">Chưa có bảng lương kỳ này.</div>';
  const dangChay = me.ky === me.kyHienTai;
  const kv = (k, v, show) => show === false ? '' : `<div class="kv"><span>${k}</span><b>${v}</b></div>`;
  return ls.map(l => `<div class="card"><h2>Phiếu lương ${esc(kyTen(me.ky))}</h2>
    ${dangChay ? '<div class="small warnc">Kỳ đang chạy: số tạm tính, sẽ thay đổi đến cuối kỳ.</div>' : ''}
    ${kv('Hình thức lương', esc(l.hinhThuc))}
    ${kv('Ngày công', num(l.ngayCong, 1))}
    ${kv('Giờ tăng ca', num(l.gioTangCa, 1), l.gioTangCa > 0)}
    ${kv('Sản lượng KFM', num(l.slKfm, 0), l.slKfm > 0)}
    ${kv('Tiền sản lượng KFM', money(l.tienKfm), l.tienKfm > 0)}
    ${kv('Tiền CPG', money(l.tienCpg), l.tienCpg > 0)}
    ${kv('Lương ngày', money(l.luongNgay), l.luongNgay > 0)}
    ${kv('Tiền tăng ca', money(l.tienTangCa), l.tienTangCa > 0)}
    ${kv('Phụ cấp', money(l.phuCap), l.phuCap > 0)}
    ${kv('Tổng thu nhập', money(l.tongThuNhap))}
    ${kv('Thuế TNCN (10%)', '− ' + money(l.thue))}
    ${kv('Tạm ứng', '− ' + money(l.tamUng), l.tamUng > 0)}
    <div class="kv total"><span style="color:var(--text)">Thực nhận</span><b>${money(l.thucNhan)}</b></div>
    <p class="small muted">${l.chotLuc ? 'Chốt lúc ' + esc(l.chotLuc) + '. ' : ''}Thắc mắc về lương, liên hệ quản lý.</p></div>`).join('');
}

function nghiHtml() {
  if (!ngayNghi) ngayNghi = todayIso();
  const t = vnNow(), min = new Date(t), max = new Date(t);
  min.setDate(t.getDate() - 7); max.setDate(t.getDate() + 60);
  const list = me.nghi || [], homNay = todayIso();
  return `<div class="card"><h2>Xin nghỉ</h2>
    <div class="lbl" style="margin-top:8px">LOẠI NGHỈ</div>
    <div class="types">${LOAI_NGHI.map(x => `<button data-type="${x[0]}" class="${x[0] === loaiNghi ? 'on' : ''}">${x[1]}</button>`).join('')}</div>
    <label for="iNgay">Ngày nghỉ</label>
    <input id="iNgay" type="date" value="${ngayNghi}" min="${isoOf(min)}" max="${isoOf(max)}">
    <label for="iNote">Lý do (không bắt buộc)</label>
    <textarea id="iNote" rows="2" maxlength="200">${esc(ghiChuNghi)}</textarea>
    <button class="btn" id="bNghi">GỬI ĐƠN NGHỈ</button>
    <div class="err" id="eNghi"></div>
    <p class="small muted">Gửi đơn từ 7 ngày trước đến 60 ngày tới. Đơn tự cập nhật vào bảng chấm công. Gửi lại cùng ngày sẽ thay đơn cũ. Hủy được khi ngày nghỉ chưa qua.</p></div>
    ${list.length ? `<div class="card"><h2>Đơn nghỉ của bạn</h2>${list.map(n => {
      const huy = n.trangThai === 'Đã hủy';
      return `<div class="leave"><div><b>${thuNgan(n.ngay)} ${dmy(n.ngay)} · ${esc(n.loaiTen)}</b>
        <div class="small ${huy ? 'badc' : 'okc'}">${huy ? 'Đã hủy' : 'Đã gửi'}${n.lyDo ? ' · ' + esc(n.lyDo) : ''}</div></div>
        ${!huy && n.ngay >= homNay ? `<button data-cancel="${esc(n.id)}" data-ten="${esc(n.loaiTen + ' ngày ' + dmy(n.ngay))}">Hủy</button>` : ''}</div>`;
    }).join('')}</div>` : ''}`;
}

function bindNghi() {
  document.querySelectorAll('.types button').forEach(b => b.onclick = () => { ghiChuNghi = $('iNote').value; ngayNghi = $('iNgay').value || ngayNghi; loaiNghi = b.dataset.type; render(); });
  $('iNgay').onchange = () => { ngayNghi = $('iNgay').value; };
  $('bNghi').onclick = async () => {
    if (!loaiNghi) { $('eNghi').textContent = 'Chọn loại nghỉ.'; return; }
    const ngay = $('iNgay').value;
    if (!ngay) { $('eNghi').textContent = 'Chọn ngày nghỉ.'; return; }
    ghiChuNghi = $('iNote').value.trim();
    const b = $('bNghi'); b.disabled = true; b.textContent = 'Đang gửi…';
    try {
      const r = await api('leave', { type: loaiNghi, date: ngay, note: ghiChuNghi });
      me.nghi = r.nghi;
      const ten = (LOAI_NGHI.find(x => x[0] === loaiNghi) || ['', ''])[1];
      loaiNghi = ''; ghiChuNghi = '';
      render();
      dialog('Đã gửi đơn', `Đã gửi ${ten} ngày ${dmy(ngay)}.`);
    } catch (e) {
      if (e.code === 'auth' || e.code === 'device') return dangXuat(e.message);
      b.disabled = false; b.textContent = 'GỬI ĐƠN NGHỈ'; $('eNghi').textContent = e.message;
    }
  };
  document.querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => {
    if (!await dialog('', 'Hủy đơn ' + b.dataset.ten + '?', 'Hủy đơn', 'Không')) return;
    b.disabled = true;
    try {
      const r = await api('cancelLeave', { id: b.dataset.cancel });
      me.nghi = r.nghi; render();
    } catch (e) {
      if (e.code === 'auth' || e.code === 'device') return dangXuat(e.message);
      b.disabled = false; dialog('', e.message);
    }
  });
}

/* ---------------- Khởi động ---------------- */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && store.get('fsc_app_token') && !$('nav').hidden) { startGps(true); taiTrangThai(false); }
});
if (store.get('fsc_app_token')) showMain();
else if (isIOS && !isStandalone && !store.get('fsc_app_safari')) showInstall();
else showLogin();
</script>
