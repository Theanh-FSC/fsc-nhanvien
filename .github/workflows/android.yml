name: Build APK FSC Cham Cong

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk FSC-ChamCong.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FSC-ChamCong
          path: FSC-ChamCong.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v2.0.${{ github.run_number }}
          name: FSC Chấm Công 2.0.${{ github.run_number }}
          body: |
            App chấm công FSC (Android 8 trở lên). Xác nhận giờ vào / giờ ra khi ở trong vùng GPS của kho, không quét mã vạch.
            Tải file FSC-ChamCong.apk bên dưới để cài.
          files: FSC-ChamCong.apk
          make_latest: true
